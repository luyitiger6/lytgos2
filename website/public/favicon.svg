<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="title desc">
  <title id="title">LytgOS2</title>
  <desc id="desc">LytgOS2 favicon: a dark rounded square with a glowing blue-violet L and orbital ring.</desc>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#0b1220" stroke="#2a3b55" stroke-width="0.8"/>
  <ellipse cx="16" cy="19" rx="11" ry="4.6" transform="rotate(-25 16 19)" fill="none" stroke="url(#lg)" stroke-width="0.9" opacity="0.85"/>
  <path d="M10 9 V23 H22" fill="none" stroke="url(#lg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="25" cy="13" r="1.5" fill="#34d399"/>
</svg>
