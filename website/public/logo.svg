<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-labelledby="title desc">
  <title id="title">LytgOS2</title>
  <desc id="desc">LytgOS2 wordmark with a glowing blue-violet L mark and orbital ring.</desc>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Mark -->
  <rect x="2" y="8" width="48" height="48" rx="12" fill="#0b1220" stroke="#2a3b55" stroke-width="1"/>
  <ellipse cx="26" cy="34" rx="18" ry="7.5" transform="rotate(-25 26 34)" fill="none" stroke="url(#lg)" stroke-width="1.2" opacity="0.85"/>
  <path d="M18 18 V40 H34" fill="none" stroke="url(#lg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="40" cy="22" r="2" fill="#34d399"/>

  <!-- Wordmark -->
  <text x="62" y="45" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="900" letter-spacing="-1.4" fill="#f5f5f5">Lytg<tspan fill="url(#lg)">OS2</tspan></text>
</svg>
