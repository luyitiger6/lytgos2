<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc">
  <title id="title">LytgOS2 1.0 架构图</title>
  <desc id="desc">LytgOS2 1.0 的四层架构：接入层的 CLI、Web Service 和 AgentScheduler 统一进入 AgentService；引擎层运行 ReAct 循环，由 PromptBuilder 组装上下文、ToolExecutor 执行工具；能力层包含 ProviderService、MemoryService 和 ToolRegistry；基础层包含 AgentLoader/ContextLoader、SQLite 存储和 ConfigLoader。底部虚线区域为扩展阶段能力。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#0b1220"/>

  <g font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <!-- Header -->
    <text x="48" y="52" fill="#f8fafc" font-size="30" font-weight="700">LytgOS2 1.0 架构</text>
    <text x="48" y="80" fill="#94a3b8" font-size="15">Agent OS 运行时内核 · 单机私有部署 · 数据留在企业</text>
    <text x="1152" y="52" fill="#7dd3fc" font-size="14" font-weight="600" text-anchor="end">9 模块 · 9 Tool · 12 CLI · 10 端点</text>
    <text x="1152" y="74" fill="#94a3b8" font-size="13" text-anchor="end">1.0 运行时内核</text>
    <line x1="48" y1="98" x2="1152" y2="98" stroke="#1e293b" stroke-width="1"/>

    <!-- Access layer -->
    <rect x="40" y="116" width="1120" height="120" rx="16" fill="#0f1a2b" stroke="#22324a"/>
    <text x="64" y="148" fill="#38bdf8" font-size="16" font-weight="700">接入层</text>
    <text x="64" y="168" fill="#7c8ba1" font-size="11">三种触发源</text>

    <g filter="url(#shadow)">
      <rect x="190" y="134" width="260" height="78" rx="12" fill="#142033" stroke="#38bdf8" stroke-opacity="0.55"/>
      <rect x="470" y="134" width="260" height="78" rx="12" fill="#142033" stroke="#38bdf8" stroke-opacity="0.55"/>
      <rect x="750" y="134" width="340" height="78" rx="12" fill="#142033" stroke="#38bdf8" stroke-opacity="0.55"/>
    </g>
    <text x="210" y="164" fill="#f1f5f9" font-size="16" font-weight="600">CLI Channel</text>
    <text x="210" y="188" fill="#94a3b8" font-size="12"><tspan fill="#7dd3fc" font-family="'Cascadia Code', Consolas, monospace">lytgos chat</tspan> · 本地交互</text>
    <text x="490" y="164" fill="#f1f5f9" font-size="16" font-weight="600">Web Service</text>
    <text x="490" y="188" fill="#94a3b8" font-size="12">REST API · 10 个核心端点</text>
    <text x="770" y="164" fill="#f1f5f9" font-size="16" font-weight="600">AgentScheduler</text>
    <text x="770" y="188" fill="#94a3b8" font-size="12">cron 到点触发 · 状态持久化</text>

    <line x1="320" y1="212" x2="320" y2="224" stroke="#64748b" stroke-width="1.5"/>
    <line x1="600" y1="212" x2="600" y2="224" stroke="#64748b" stroke-width="1.5"/>
    <line x1="920" y1="212" x2="920" y2="224" stroke="#64748b" stroke-width="1.5"/>
    <line x1="320" y1="224" x2="920" y2="224" stroke="#64748b" stroke-width="1.5"/>
    <line x1="600" y1="224" x2="600" y2="264" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="612" y="250" fill="#7c8ba1" font-size="11">统一入口</text>

    <!-- Engine layer -->
    <rect x="40" y="264" width="1120" height="216" rx="16" fill="#0f1a2b" stroke="#22324a"/>
    <text x="64" y="296" fill="#34d399" font-size="16" font-weight="700">引擎层</text>
    <text x="64" y="316" fill="#7c8ba1" font-size="11">编排与 ReAct 循环</text>

    <g filter="url(#shadow)">
      <rect x="470" y="284" width="260" height="54" rx="12" fill="#122a25" stroke="#34d399" stroke-opacity="0.7"/>
      <rect x="470" y="380" width="260" height="58" rx="12" fill="#0f2236" stroke="#38bdf8" stroke-opacity="0.75"/>
      <rect x="170" y="380" width="250" height="58" rx="12" fill="#142033" stroke="#2f4463"/>
      <rect x="780" y="380" width="250" height="58" rx="12" fill="#142033" stroke="#2f4463"/>
    </g>
    <text x="600" y="309" fill="#ecfdf5" font-size="16" font-weight="600" text-anchor="middle">AgentService</text>
    <text x="600" y="328" fill="#94a3b8" font-size="11" text-anchor="middle">统一入口 · ProfileContext</text>
    <line x1="600" y1="338" x2="600" y2="380" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="600" y="405" fill="#e0f2fe" font-size="16" font-weight="600" text-anchor="middle">ReActLoop</text>
    <text x="600" y="425" fill="#94a3b8" font-size="11" text-anchor="middle">Reason → Act → Observe</text>
    <text x="195" y="405" fill="#f1f5f9" font-size="15" font-weight="600">PromptBuilder</text>
    <text x="195" y="425" fill="#94a3b8" font-size="11">system prompt · 历史 · Tool</text>
    <text x="805" y="405" fill="#f1f5f9" font-size="15" font-weight="600">ToolExecutor</text>
    <text x="805" y="425" fill="#94a3b8" font-size="11">执行 · 审计 · 回填</text>
    <line x1="420" y1="409" x2="470" y2="409" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="730" y1="409" x2="780" y2="409" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="600" y="462" fill="#7c8ba1" font-size="11" text-anchor="middle">默认最多 10 轮 · 同步执行 · 每次调用写审计表</text>

    <!-- Capability layer -->
    <rect x="40" y="504" width="1120" height="170" rx="16" fill="#0f1a2b" stroke="#22324a"/>
    <text x="64" y="532" fill="#a78bfa" font-size="16" font-weight="700">能力层</text>
    <text x="64" y="552" fill="#7c8ba1" font-size="11">ReAct 调度的三块能力</text>

    <g filter="url(#shadow)">
      <rect x="80" y="566" width="330" height="90" rx="12" fill="#1a1630" stroke="#a78bfa" stroke-opacity="0.65"/>
      <rect x="435" y="566" width="330" height="90" rx="12" fill="#2a2314" stroke="#fbbf24" stroke-opacity="0.65"/>
      <rect x="790" y="566" width="330" height="90" rx="12" fill="#122a25" stroke="#34d399" stroke-opacity="0.65"/>
    </g>
    <text x="100" y="596" fill="#f5f3ff" font-size="16" font-weight="600">ProviderService</text>
    <text x="100" y="618" fill="#c4b5fd" font-size="12">Spring AI Alibaba</text>
    <text x="100" y="638" fill="#94a3b8" font-size="12">DeepSeek · Kimi · 显式映射</text>
    <text x="455" y="596" fill="#fffbeb" font-size="16" font-weight="600">MemoryService</text>
    <text x="455" y="618" fill="#fcd34d" font-size="12">会话记忆 + 长期记忆</text>
    <text x="455" y="638" fill="#94a3b8" font-size="12">MEMORY.md · 核心 / 归档</text>
    <text x="810" y="596" fill="#ecfdf5" font-size="16" font-weight="600">ToolRegistry</text>
    <text x="810" y="618" fill="#6ee7b7" font-size="12">9 个内置 Tool · MCP · @Tool</text>
    <text x="810" y="638" fill="#94a3b8" font-size="12">WhitelistSandbox · notify</text>

    <path d="M600 438 V490" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <path d="M600 490 H245 V566" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M600 490 V566" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M600 490 H955 V566" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Foundation layer -->
    <rect x="40" y="704" width="1120" height="108" rx="16" fill="#0f1a2b" stroke="#22324a"/>
    <text x="64" y="734" fill="#fbbf24" font-size="16" font-weight="700">基础层</text>
    <text x="64" y="752" fill="#7c8ba1" font-size="11">共享支撑设施</text>

    <g filter="url(#shadow)">
      <rect x="80" y="758" width="340" height="50" rx="10" fill="#142033" stroke="#2f4463"/>
      <rect x="450" y="758" width="340" height="50" rx="10" fill="#142033" stroke="#2f4463"/>
      <rect x="820" y="758" width="300" height="50" rx="10" fill="#142033" stroke="#2f4463"/>
    </g>
    <text x="100" y="780" fill="#f1f5f9" font-size="14" font-weight="600">AgentLoader / ContextLoader</text>
    <text x="100" y="800" fill="#94a3b8" font-size="11">AGENT.md · skills · Bootstrap</text>
    <text x="470" y="780" fill="#f1f5f9" font-size="14" font-weight="600">SQLite Storage</text>
    <text x="470" y="800" fill="#94a3b8" font-size="11">6 张表 · Flyway 迁移</text>
    <text x="840" y="780" fill="#f1f5f9" font-size="14" font-weight="600">ConfigLoader</text>
    <text x="840" y="800" fill="#94a3b8" font-size="11">环境变量 · ${ENV_VAR} · 校验</text>

    <!-- Extension strip -->
    <rect x="40" y="824" width="1120" height="44" rx="10" fill="none" stroke="#334155" stroke-dasharray="6 6"/>
    <text x="64" y="851" fill="#7c8ba1" font-size="13"><tspan fill="#fbbf24" font-weight="600">扩展阶段（非 1.0）</tspan>：IM Channel · Persona · Knowledge · SSO / 多租户 · Web 仪表板 · 容器 Sandbox</text>

    <!-- Footer -->
    <text x="48" y="886" fill="#64748b" font-size="11">实线：1.0 运行时链路</text>
    <text x="1152" y="886" fill="#64748b" font-size="11" text-anchor="end">LytgOS2 1.0 · 9 模块 · 9 Tool · 12 CLI · 10 端点 · 2 个硬性 Demo</text>
  </g>
</svg>
