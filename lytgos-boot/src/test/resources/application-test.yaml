spring:
  main:
    banner-mode: off
  datasource:
    url: jdbc:sqlite:target/lytgos-test.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
    locations: classpath:db/migration/sqlite

logging:
  level:
    root: WARN
    io.lytgos: INFO

lytgos:
  workspace: target/lytgos-test-workspace
  providers: []
