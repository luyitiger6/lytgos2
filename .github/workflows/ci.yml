name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build and quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make wrapper executable
        run: chmod +x mvnw
      - name: Verify
        run: ./mvnw -B -ntp verify
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
            **/target/spotbugsXml.xml
            **/target/pmd.xml
            **/target/checkstyle-result.xml
          if-no-files-found: ignore

  p3c:
    name: Alibaba P3C gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make wrapper executable
        run: chmod +x mvnw
      - name: P3C gate
        run: ./mvnw -B -ntp -Pp3c verify -DskipTests
      - name: Ensure P3C analysis produced no errors
        run: |
          if grep -R --include='pmd.xml' '<error ' .; then
            echo "P3C analysis errors found; see the pmd.xml reports above." >&2
            exit 1
          fi
      - name: Upload P3C reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3c-reports
          path: '**/target/pmd.xml'
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  security:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make wrapper executable
        run: chmod +x mvnw
      - name: Dependency-Check
        if: env.NVD_API_KEY != ''
        run: ./mvnw -B -ntp -Psecurity verify -DskipTests

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make wrapper executable
        run: chmod +x mvnw
      - name: Generate SBOM
        run: ./mvnw -B -ntp -Psecurity -Ddependency-check.skip=true verify -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/classes/META-INF/sbom/*.cdx.json
          if-no-files-found: error
